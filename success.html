<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Payment Status</title></head><body><section><div class="heroBox"><h1 id="t">Checking payment...</h1><p id="m">Please wait while we verify your order.</p><a class="btn" href="/">Back to website</a></div></section><script>let id=new URLSearchParams(location.search).get('order_id');fetch('/api/order-status?order_id='+encodeURIComponent(id||'')).then(r=>r.json()).then(d=>{t.textContent=d.status==='SUCCESS'?'Payment successful':'Payment pending';m.textContent=d.message}).catch(()=>m.textContent='Please contact support with your order ID: '+id)</script></body></html>
